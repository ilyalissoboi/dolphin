# Builds, checks and publishes fork releases.
#
# Pushing an annotated tag such as 2606-fork-14 builds the Windows, macOS and Android packages from
# the tagged commit and publishes them as the GitHub release of that tag (see
# .github/release/README.md). Pull requests that change this workflow, and manual runs, build and
# check the same packages without publishing; they are kept as workflow artifacts.
name: Release

on:
  push:
    tags:
      - '*-fork-*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  OUT_DIR: ${{ github.workspace }}/out

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release/prepare-checkout.sh

      - name: Set up MSVC x64 environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No Visual Studio installation with the x64 C++ tools' }
          "Visual Studio: $vs"
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Add-Content $env:GITHUB_ENV -Encoding utf8 }
          }

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The default target does not build the test executables.
          cmake --build build --target tests qt-tests

      - name: Test and package
        shell: pwsh
        env:
          BUILD_DIR: ${{ github.workspace }}/build
          GH_TOKEN: ${{ github.token }}
        run: '& ./.github/release/package-windows.ps1'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: windows-x64
          path: ${{ env.OUT_DIR }}
          if-no-files-found: ignore

  macos:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 300
    env:
      # The same upstream MoltenVK release that the local fork builds bundled.
      MOLTENVK_VERSION: v1.4.1
      MOLTENVK_SHA256: 5ea0c259df7ded9a275444820f09cced54d6e5a7c7a31d262de62a5cdb7e15cf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release/prepare-checkout.sh

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install qt gettext ninja
          mkdir -p "$RUNNER_TEMP/moltenvk"
          curl -fsSL -o "$RUNNER_TEMP/moltenvk/MoltenVK-macos.tar" \
            "https://github.com/KhronosGroup/MoltenVK/releases/download/$MOLTENVK_VERSION/MoltenVK-macos.tar"
          echo "$MOLTENVK_SHA256  $RUNNER_TEMP/moltenvk/MoltenVK-macos.tar" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/moltenvk/MoltenVK-macos.tar" -C "$RUNNER_TEMP/moltenvk" \
            MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          echo "MOLTENVK_DYLIB=$RUNNER_TEMP/moltenvk/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix gettext)" \
            -DUSE_SYSTEM_LIBS=OFF -DUSE_BUNDLED_MOLTENVK=OFF -DMOLTENVK_DYLIB="$MOLTENVK_DYLIB" \
            -DPOSTPROCESS_BUNDLE=ON -DENABLE_TESTS=OFF

      - name: Build
        run: cmake --build build --target build_final_bundle

      - name: Check and package
        env:
          BUILD_DIR: ${{ github.workspace }}/build
        run: bash .github/release/package-macos.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: macos-arm64
          path: ${{ env.OUT_DIR }}
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      NDK_VERSION: 30.0.15729638
      BUILD_TOOLS_VERSION: 37.0.0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL \
            "$ANDROID_HOME"/ndk/27.* "$ANDROID_HOME"/ndk/29.*
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release/prepare-checkout.sh

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Download Gradle
        working-directory: Source/Android
        run: |
          # The wrapper gives up on a slow download after 10 seconds; retry before failing the job.
          for attempt in 1 2 3 4 5; do
            ./gradlew --no-daemon --version && exit 0
            echo "::warning::Gradle download attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build and test
        working-directory: Source/Android
        run: |
          # Cap native compile jobs: two ABIs build at once on a 4-core, 16 GB runner.
          cat > "$RUNNER_TEMP/jobs.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
              project.pluginManager.withPlugin('com.android.application') {
                  project.androidComponents.finalizeDsl { android ->
                      def cmake = android.defaultConfig.externalNativeBuild.cmake
                      cmake.arguments.addAll(['-DCMAKE_JOB_POOLS=release_compile=4', '-DCMAKE_JOB_POOL_COMPILE=release_compile'])
                  }
              }
          }
          GRADLE
          ./gradlew --no-daemon --max-workers=2 --init-script "$RUNNER_TEMP/jobs.init.gradle" \
            :app:assembleRelease :app:testDebugUnitTest \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

          mkdir -p "$OUT_DIR"
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$apk" "$RUNNER_TEMP/$PACKAGE-unsigned.apk"
          echo "UNSIGNED_APK=$RUNNER_TEMP/$PACKAGE-unsigned.apk" >> "$GITHUB_ENV"

          tests=0; failures=0; errors=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            tests=$((tests + $(sed -n 's/.*<testsuite [^>]*tests="\([0-9]*\)".*/\1/p' "$f" | head -n 1)))
            failures=$((failures + $(sed -n 's/.*<testsuite [^>]*failures="\([0-9]*\)".*/\1/p' "$f" | head -n 1)))
            errors=$((errors + $(sed -n 's/.*<testsuite [^>]*errors="\([0-9]*\)".*/\1/p' "$f" | head -n 1)))
          done
          if [[ $tests == 0 || $failures != 0 || $errors != 0 ]]; then
            echo "::error::JVM tests: $tests run, $failures failed, $errors errors"
            exit 1
          fi
          echo "- **Android build:** the Release APK built for arm64-v8a and x86_64 (NDK \`$NDK_VERSION\`). JVM tests: $tests run, $failures failed." \
            > "$OUT_DIR/verify-android.md"

      - name: Sign and check
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            if $IS_RELEASE; then
              echo "::error::the ANDROID_KEYSTORE_BASE64 secret is not set; release APKs must be signed"
              exit 1
            fi
            echo "::warning::no signing keystore available; keeping the unsigned APK"
            cp "$UNSIGNED_APK" "$OUT_DIR/"
            exit 0
          fi
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          bash .github/release/sign-android.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: android
          path: ${{ env.OUT_DIR }}
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: [windows, macos, android]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 50 --json tagName --jq '.[].tagName')
          prev=$(grep -E -- '-fork-[0-9]+$' <<< "$releases" | grep -vxF -- "$tag" | head -n 1 || true)
          { echo "TAG=$tag"; echo "PREV_TAG=$prev"; echo "COMMIT=$(git rev-parse HEAD)"; } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES_DIR: ${{ runner.temp }}/packages
        run: bash .github/release/publish.sh
